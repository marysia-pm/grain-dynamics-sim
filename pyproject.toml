[project]
name = "rough-slope-sim"
version = "0.1.0"
description = "Ball-on-rough-inclined-slope physics simulation and roughness/diffusion analysis (thesis code, refactored)"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66.0",
    "pandas>=2.1.0",
    "opencv-python>=4.8.0",
    "torch>=2.2.0",
]

[project.scripts]
rough-slope-sim = "rough_slope_sim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "snakeviz>=2.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rough_slope_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]